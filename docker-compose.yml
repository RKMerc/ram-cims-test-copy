
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ram-cims-app
    container_name: ram-cims-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - ram-network

  db:
    image: mariadb:10.6
    container_name: ram-cims-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ram_cims
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    networks:
      - ram-network

networks:
  ram-network:
    driver: bridge